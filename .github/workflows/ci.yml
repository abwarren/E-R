name: CI

on:
  push:
    branches: [master, engine]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # E9,F63,F7,F82 — syntax errors
          # W291,W293 — trailing whitespace
          # E302 — expected 2 blank lines (new code)
          flake8 backend/app.py --count --select=E9,F63,F7,F82,W291,W293 --show-source --statistics
          flake8 backend/buffer.py --count --select=E9,F63,F7,F82,W291,W293 --show-source --statistics

      - name: Run selection tests
        run: python3 scripts/test_api_selection.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build er-remote image
        run: docker build -t er-remote:ci -f Dockerfile .

      - name: Verify er-remote image
        run: |
          docker run -d --name er-remote-ci er-remote:ci sleep 30
          docker logs er-remote-ci 2>&1 | head -20
          docker rm -f er-remote-ci
